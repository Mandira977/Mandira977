<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .pulse-ring {
        animation: pulseRing 1.8s infinite;
      }

      @keyframes pulseRing {
        0% {
          transform: scale(1);
          opacity: 0.9;
        }
        70% {
          transform: scale(1.3);
          opacity: 0;
        }
        100% {
          transform: scale(1.3);
          opacity: 0;
        }
      }

      .mic-glow {
        box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.65);
        animation: micGlow 1.4s infinite;
      }

      @keyframes micGlow {
        0% {
          box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.65);
        }
        100% {
          box-shadow: 0 0 0 20px rgba(59, 130, 246, 0);
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-6">
    <main class="w-full max-w-3xl rounded-3xl border border-slate-700 bg-slate-800/90 p-6 shadow-2xl">
      <h1 class="text-3xl font-bold text-center">🎙️ Voice AI Assistant</h1>
      <p class="text-slate-300 text-center mt-2">
        Speak naturally. Try: <span class="text-blue-300">"What time is it?"</span>,
        <span class="text-blue-300">"Open YouTube"</span>,
        <span class="text-blue-300">"Search for JavaScript tutorials"</span>
      </p>

      <section class="mt-8 flex flex-col items-center gap-4">
        <div class="relative">
          <div id="ring" class="hidden pulse-ring absolute inset-0 rounded-full bg-blue-500/40"></div>
          <button
            id="micButton"
            class="relative z-10 w-24 h-24 rounded-full bg-blue-500 hover:bg-blue-400 transition text-4xl"
            aria-label="Start voice assistant"
          >
            🎤
          </button>
        </div>

        <p id="status" class="text-sm text-slate-300">Press the microphone to start listening.</p>
      </section>

      <section class="mt-8 grid gap-4 md:grid-cols-2">
        <div class="rounded-2xl bg-slate-900/70 p-4 border border-slate-700">
          <h2 class="font-semibold text-blue-300">You said</h2>
          <p id="heardText" class="mt-2 text-slate-200 min-h-[2.5rem]">—</p>
        </div>

        <div class="rounded-2xl bg-slate-900/70 p-4 border border-slate-700">
          <h2 class="font-semibold text-emerald-300">Assistant reply</h2>
          <p id="replyText" class="mt-2 text-slate-200 min-h-[2.5rem]">—</p>
        </div>
      </section>

      <section class="mt-8 rounded-2xl bg-slate-900/70 p-4 border border-slate-700">
        <h2 class="font-semibold text-violet-300">Conversation log</h2>
        <ul id="history" class="mt-2 space-y-2 text-sm max-h-52 overflow-auto pr-2"></ul>
      </section>
    </main>

    <script>
      const micButton = document.getElementById("micButton");
      const statusEl = document.getElementById("status");
      const heardTextEl = document.getElementById("heardText");
      const replyTextEl = document.getElementById("replyText");
      const historyEl = document.getElementById("history");
      const ringEl = document.getElementById("ring");

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const synth = window.speechSynthesis;

      if (!SpeechRecognition || !synth) {
        statusEl.textContent = "Your browser doesn't support required voice APIs. Please use Chrome or Edge.";
        micButton.disabled = true;
        micButton.classList.add("opacity-50", "cursor-not-allowed");
      }

      const recognition = SpeechRecognition
        ? new SpeechRecognition()
        : null;

      if (recognition) {
        recognition.lang = "en-US";
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
      }

      const addLog = (speaker, message) => {
        const item = document.createElement("li");
        item.className = "rounded-lg bg-slate-800 px-3 py-2 border border-slate-700";
        item.innerHTML = `<span class="font-semibold ${speaker === "You" ? "text-blue-300" : "text-emerald-300"}">${speaker}:</span> ${message}`;
        historyEl.prepend(item);
      };

      const speak = (text) => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1;
        utterance.pitch = 1;
        utterance.lang = "en-US";
        synth.speak(utterance);
      };

      const getAssistantReply = (input) => {
        const text = input.toLowerCase();

        if (text.includes("hello") || text.includes("hi")) {
          return "Hello! How can I help you today?";
        }
        if (text.includes("your name")) {
          return "I am your browser-based voice AI assistant.";
        }
        if (text.includes("time")) {
          return `It is ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}.`;
        }
        if (text.includes("date") || text.includes("day")) {
          return `Today is ${new Date().toLocaleDateString(undefined, {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
          })}.`;
        }
        if (text.includes("open youtube")) {
          window.open("https://www.youtube.com", "_blank");
          return "Opening YouTube.";
        }
        if (text.includes("open google")) {
          window.open("https://www.google.com", "_blank");
          return "Opening Google.";
        }
        if (text.includes("search for")) {
          const query = input.toLowerCase().split("search for")[1]?.trim();
          if (query) {
            window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, "_blank");
            return `Searching Google for ${query}.`;
          }
        }
        if (text.includes("thank")) {
          return "You're welcome!";
        }

        return "I heard you clearly, but I do not have an advanced language model connected yet. You can ask me for time, date, web search, or opening YouTube and Google.";
      };

      const setListeningState = (isListening) => {
        if (isListening) {
          micButton.classList.add("mic-glow");
          ringEl.classList.remove("hidden");
          statusEl.textContent = "Listening... speak now.";
        } else {
          micButton.classList.remove("mic-glow");
          ringEl.classList.add("hidden");
          statusEl.textContent = "Press the microphone to start listening.";
        }
      };

      micButton.addEventListener("click", () => {
        if (!recognition) {
          return;
        }

        synth.cancel();
        setListeningState(true);
        recognition.start();
      });

      if (recognition) {
        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          heardTextEl.textContent = transcript;
          addLog("You", transcript);

          const reply = getAssistantReply(transcript);
          replyTextEl.textContent = reply;
          addLog("Assistant", reply);
          speak(reply);
        };

        recognition.onerror = (event) => {
          setListeningState(false);
          statusEl.textContent = `Error: ${event.error}. Please allow microphone access.`;
        };

        recognition.onend = () => {
          setListeningState(false);
        };
      }
    </script>
  </body>
</html>
